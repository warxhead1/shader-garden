name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    # Reusable-workflow call: this makes the test battery a real job in this
    # run's graph, so `upload` below can `needs:` it exactly like any other
    # job (no cross-workflow polling, no separate success/failure event to
    # interpret). test.yml is still its own file so it can independently
    # gate PRs via its own pull_request trigger.
    uses: ./.github/workflows/test.yml
    with:
      # `deploy`, and deliberately. Every commit that reaches main has already
      # passed all 20 suites on a REAL GPU via the blocking pre-push gate
      # (scripts/gpu-gate.sh), in about eleven minutes — strictly stronger
      # evidence than a SwiftShader runner can produce, since CI cannot prove
      # a pixel came off real hardware at all (see test.yml's
      # SG_ALLOW_SOFTWARE comment).
      #
      # `fast` was already an attempt at this and was still not enough. The
      # run on 42fdf0f sat in `garden` for over three hours; run 32654025156
      # hit the 150-minute cap and reported nothing; run 32676190323 spent ten
      # minutes each in garden-movement and garden-camera without finishing
      # either, because the garden renders at 0 fps on a machine with no GPU
      # and every assertion in those suites is driven by a frame. Against the
      # job's timeout-minutes that is not "slow", it is a deploy that fails on
      # timeout and ships nothing — which is exactly what happened on every
      # single run between 2026-07-06 and 2026-08-23.
      #
      # The suites this drops are not unowned. test.yml's nightly `schedule`
      # runs the FULL battery against main, and PRs run `fast` — so a commit
      # that reached main without the local gate (--no-verify, a GitHub-side
      # merge) is still caught within a day. A day of exposure to a
      # SwiftShader-only regression is a much smaller risk than a deploy path
      # that cannot complete, and seven weeks of not deploying at all is what
      # the stricter choice actually bought.
      tier: deploy

  editor-bundle-diff:
    # ED-2: site/js/vendor/cm-editor.bundle.js is committed, not CI-built
    # (ARCHITECTURE.md / tools/editor-bundle/README.md) — this job is the
    # drift guard: esbuild is deterministic given the pinned lockfile, so a
    # rebuild that doesn't byte-match the committed chunk means vendor/ or
    # package-lock.json changed without the chunk being regenerated.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install bundle tooling
        working-directory: tools/editor-bundle
        run: npm ci --no-fund --no-audit

      - name: Rebuild the CodeMirror vendor chunk
        working-directory: tools/editor-bundle
        run: node build.mjs

      - name: Fail on drift vs the committed chunk
        run: git diff --exit-code -- site/js/vendor/cm-editor.bundle.js

  upload:
    needs: [test, editor-bundle-diff]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Substitute repo placeholder
        run: sed -i "s|OWNER_REPO_PLACEHOLDER|${{ github.repository }}|g" site/js/share.js

      - name: Stamp service-worker cache version
        # Every deploy byte-changes sw.js so returning clients' SW update check
        # fires and the versioned precache is rebuilt (see site/sw.js VERSION).
        run: sed -i "s|SW_BUILD_PLACEHOLDER|${{ github.sha }}|g" site/sw.js

      - name: Point the deployed site at the relay
        # site/assets/relay.json ships as
        #   {"url": null, "transport": "p2p", "iceServers": []}
        # The default URL is null (resolveTransportConfig treats this as a clean
        # no-multiplayer site, NOT an error). To switch multiplayer on:
        #   1. Set the repository VARIABLE SG_RELAY_URL to a public wss://
        #      endpoint (the wss:// signaling server, also reused as the
        #      signaling URL in p2p mode). A variable, not a secret: this is
        #      a public endpoint that ships inside a public artifact, and
        #      pretending otherwise would just hide it from the people
        #      maintaining it.
        #   2. Optionally, set the repository SECRET SG_ICE_SERVERS_JSON to a
        #      JSON array of RTCIceServer-shaped objects (used verbatim as the
        #      WebRTC `iceServers` list). Validate the JSON via Node, NEVER
        #      shell parsing — the brief is explicit that the emitted file
        #      must be a single, valid JSON document. If unset, an empty
        #      array is written (no TURN — direct connectivity only).
        env:
          RELAY_URL: ${{ vars.SG_RELAY_URL }}
          ICE_SERVERS_JSON: ${{ secrets.SG_ICE_SERVERS_JSON }}
        run: |
          set -euo pipefail
          # Correction 6: env parsing simplification. The previous shell
          # inline passed `SG_ICE_SERVERS_JSON_RAW="$ICE_SERVERS_JSON"` as
          # a *literal string after* the inline script and then read it back
          # from `process.env.SG_ICE_SERVERS_JSON_RAW` inside node — a
          # roundabout that depends on Node's option-vs-argv split NOT
          # swallowing the trailing token. (`node -e SCRIPT ARG ARG` does
          # work, but only because `-e` accepts one more argv pair than
          # `--` would, which is fragile and undocumented at the shell
          # layer.) The simpler contract: pass the JSON via argv directly,
          # using `--` so node stops parsing options and forwards the rest
          # to `process.argv` unchanged. Same JSON, less indirection, no
          # env-var hand-off in the middle.
          ICE='[]'
          if [ -n "${ICE_SERVERS_JSON:-}" ]; then
            ICE="$(node -e '
              const raw = process.argv[1] || "";
              let arr;
              try { arr = JSON.parse(raw); }
              catch (e) {
                console.error("::error::SG_ICE_SERVERS_JSON must be valid JSON:", e.message);
                process.exit(1);
              }
              if (!Array.isArray(arr)) {
                console.error("::error::SG_ICE_SERVERS_JSON must be a JSON ARRAY of RTCIceServer-shaped objects.");
                process.exit(1);
              }
              for (const [i, e] of arr.entries()) {
                if (!e || typeof e !== "object" || Array.isArray(e)) {
                  console.error("::error::entry " + i + " is not an object.");
                  process.exit(1);
                }
                if (typeof e.urls !== "string" && !Array.isArray(e.urls)) {
                  console.error("::error::entry " + i + " has no string|array `urls` field.");
                  process.exit(1);
                }
                // Correction 6b: an array `urls` must be nonempty and all-string,
                // per the WebRTC RTCIceServer contract — an empty array would
                // silently never dial, and a mixed-type array (e.g. one object
                // entry) is a malformed config the browser would ignore without
                // surfacing the error. String form is unrestricted (spec
                // requires urls-as-string to be a single valid URL).
                if (Array.isArray(e.urls)) {
                  if (e.urls.length === 0) {
                    console.error("::error::entry " + i + " has an empty `urls` array (must be a nonempty array of strings).");
                    process.exit(1);
                  }
                  if (!e.urls.every((u) => typeof u === "string")) {
                    console.error("::error::entry " + i + " `urls` array must contain only strings.");
                    process.exit(1);
                  }
                }
                if ("username" in e && typeof e.username !== "string") {
                  console.error("::error::entry " + i + " `username` must be a string when present.");
                  process.exit(1);
                }
                if ("credential" in e && typeof e.credential !== "string") {
                  console.error("::error::entry " + i + " `credential` must be a string when present.");
                  process.exit(1);
                }
                if ("credentialType" in e && e.credentialType !== "password" && e.credentialType !== "oauth") {
                  console.error("::error::entry " + i + " `credentialType` must be \"password\" or \"oauth\".");
                  process.exit(1);
                }
              }
              process.stdout.write(JSON.stringify(arr));
            ' -- "$ICE_SERVERS_JSON")"
            echo "ICE servers configured: $(node -e 'process.stdout.write(String(JSON.parse(process.argv[1]).length))' -- "$ICE") entries."
          fi
          # Pages is https, and a ws:// dial from an https page is blocked by
          # the browser SILENTLY (net.js says so at its own localhost branch).
          # Fail the deploy instead of shipping a site whose multiplayer looks
          # broken for no visible reason.
          if [ -z "$RELAY_URL" ]; then
            echo "SG_RELAY_URL unset — deploying a single-player site (no relay, transport=p2p but no signaling target)."
            node -e 'process.stdout.write(JSON.stringify({url: null, transport: "p2p", iceServers: JSON.parse(process.argv[1])}))' -- "$ICE" > site/assets/relay.json
            exit 0
          fi
          case "$RELAY_URL" in
            wss://*) ;;
            *) echo "::error::SG_RELAY_URL must be wss:// (got '$RELAY_URL'); ws:// is blocked as mixed content on Pages." ; exit 1 ;;
          esac
          node -e '
            const out = { url: process.argv[1], transport: "p2p", iceServers: JSON.parse(process.argv[2]) };
            process.stdout.write(JSON.stringify(out));
          ' -- "$RELAY_URL" "$ICE" > site/assets/relay.json
          echo "Relay configured: $RELAY_URL (transport=p2p)"

      - name: Check budgets
        run: python3 tools/check_budgets.py

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: upload
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
