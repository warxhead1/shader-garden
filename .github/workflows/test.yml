name: Test battery

# Headless verification harness (tools/test/*.mjs) — see ARCHITECTURE.md and
# tools/launch_checklist.md for what this does and doesn't cover. Every
# suite runs in its own process, sequentially: tools/test/browser.mjs's
# serveSite()/derivePort() are pid-derived, and parallel suites are a known
# source of flake (a hero-rAF visibility check under machine load), not a
# theoretical one.

on:
  pull_request:
  workflow_dispatch:
    inputs:
      tier:
        description: 'deploy = only what a GPU-less runner can actually finish; fast = adds the SwiftShader-bound visual suites; full = everything'
        type: choice
        options: [deploy, fast, full]
        default: full
  # The full battery on a schedule, so the suites the PR tier skips still run
  # every day against main rather than only when someone remembers to dispatch.
  schedule:
    - cron: '17 9 * * *'
  # Pushes to main don't trigger this directly — deploy.yml calls this
  # workflow as a job (workflow_call) and gates the Pages deploy on it via a
  # real `needs:` in that run's graph. Triggering push:main here too would
  # just run the same battery twice for the same commit.
  workflow_call:
    inputs:
      tier:
        description: 'deploy|fast|full — deploy.yml passes deploy; the pre-push real-GPU gate is the stronger check, and the nightly schedule runs full'
        type: string
        default: full

jobs:
  test:
    runs-on: ubuntu-latest
    # Without this the job inherits GitHub's 360-minute default, so a suite
    # that genuinely hangs burns six hours of runner time before anything
    # intervenes. Observed real cost on this runner: the whole battery is
    # dominated by SwiftShader software-rasterizing a full-screen raymarch
    # (`garden` alone measured >40 min), so this is set well above the honest
    # worst case rather than tight — it is a runaway backstop, not a budget.
    # 45 for the deploy tier, 150 for fast, 330 for the nightly full tier
    # (which adds `garden` alone at >40 min under SwiftShader). This is now
    # only a RUNAWAY BACKSTOP: the real budget is the per-step
    # `timeout-minutes` on every suite below.
    #
    # It has to be, because a job-level cap is the one budget that cannot
    # produce a report. CI run 32654025156 — the first run with the verdict
    # step, so the first that did not stop at the first broken suite — spent
    # 55 minutes inside mp-two-browsers alone (one waitForFunction sat for
    # 724423ms) and hit 150 minutes during mp-solo-parity. The job was
    # CANCELLED, so the verdict never ran, `failure()` was false, the artifact
    # upload was skipped, and 2.5 hours of runner time produced nothing that
    # could be read. Per-step caps turn that into "one suite reports FAIL"
    # instead of "the run reports nothing".
    timeout-minutes: ${{ (inputs.tier || (github.event_name == 'pull_request' && 'fast' || 'full')) == 'deploy' && 45 || ((inputs.tier || (github.event_name == 'pull_request' && 'fast' || 'full')) == 'fast' && 150 || 330) }}
    env:
      # GitHub's runners have no GPU. Every suite that calls assertRealGpu()/
      # assertRealWebgl2() would refuse the SwiftShader adapter it finds here,
      # so CI accepts software deliberately and the suites run for their DOM,
      # protocol and logic assertions — which are the ones a GPU-less runner
      # can actually verify.
      #
      # This is exactly why scripts/gpu-gate.sh exists as a local, BLOCKING
      # pre-push hook: the "these pixels came off real hardware" claim is
      # unprovable here by construction, so it is enforced there instead.
      # Nothing in CI should ever be read as evidence of real-GPU behaviour.
      # A GitHub runner has no GPU, so every full-screen raymarch suite is
      # software-rasterized by SwiftShader. Measured on this runner: `garden`
      # alone exceeded 40 minutes against 283s on a real GPU. Those suites
      # still matter, but paying for them on every PR push makes the gate
      # unusable, so the PR tier skips them and the nightly `schedule` above
      # runs the whole battery. deploy.yml passes `fast` too: everything on
      # main already cleared all 20 suites on a real GPU via the blocking
      # pre-push gate, which SwiftShader cannot match, and a full run there
      # took over three hours — long enough to fail on timeout and ship
      # nothing.
      # THREE tiers, because the runner has no GPU and that is not a budget
      # problem, it is a physics problem.
      #
      #   deploy — what a GPU-less runner can actually FINISH. Pure-node
      #            protocol/relay suites, the DOM/composition/loader suites,
      #            and smoke. Measured on this runner: ~20 minutes.
      #   fast   — adds the suites SwiftShader can technically run but only
      #            very slowly (garden movement/camera, the two-page MP
      #            suites). PRs get this; nobody is blocked on a PR.
      #   full   — everything, including `garden` at >40 minutes. Nightly.
      #
      # The split is not a coverage cut, it is a routing decision. Every
      # commit that reaches main has already passed ALL 20 suites on a real
      # GPU in ~11 minutes via the blocking pre-push gate — strictly stronger
      # evidence than SwiftShader can produce, since a software rasterizer
      # cannot prove a pixel came off hardware at all. What the deploy tier
      # drops is the suites where CI was measuring SwiftShader rather than
      # the product, and MEASURING IT BADLY: run 32676190323 rendered the
      # garden at `0 fps · 0.56x` with the auto-ladder already on its floor,
      # so every rAF-driven assertion in those suites was waiting on frames
      # that were never going to arrive. garden-movement and garden-camera
      # each burned their full 10-minute step cap doing it.
      #
      # Those suites still run — on PRs, and nightly against main. They just
      # no longer stand between a green commit and a published site. The
      # deploy had not shipped since 2026-07-05 because they did.
      TIER: ${{ inputs.tier || (github.event_name == 'pull_request' && 'fast' || 'full') }}
      SG_ALLOW_SOFTWARE: '1'
      # A GitHub runner is 2 cores with no GPU, and it is roughly an order of
      # magnitude slower than the workstation every timeout in this harness was
      # tuned on. Measured on this runner: the #/garden route took 44s against
      # ~4s locally, and the editor mount took 18269ms against a budget of 8000.
      #
      # These raise WAIT BUDGETS only. No assertion is weakened: a mount that
      # never happens still fails, an element that never becomes actionable
      # still fails, a hero loop that does not resume still fails. They exist so
      # that "this machine is slow" stops being reported as "this product is
      # broken". Deliberately set HERE and not as the library default, so a
      # developer box keeps the tight budgets that surface real regressions.
      # ONE knob, not one per symptom. It scales sleep(), setDefaultTimeout, and
      # every explicit `timeout:` passed to goto/waitForSelector/waitForFunction
      # — which is what reaches the 101 hard-coded budgets and 214 fixed sleeps
      # spread across 20 suite files. Chasing those individually costs one CI
      # round-trip per discovery; three were spent that way before this landed.
      #
      # 6, not the measured ~10: enough headroom for the numbers actually
      # observed (18269ms and 19998ms editor mounts against 8000ms; 44s vs ~4s
      # for #/garden) without multiplying every genuine hang by ten before the
      # job times out.
      SG_TIME_SCALE: '6'
    defaults:
      run:
        # Explicit `shell: bash` runs steps with `-o pipefail` (the implicit
        # default shell does NOT) — without it every `node suite.mjs | tee`
        # step below would report tee's exit code and a failing suite would
        # pass silently.
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # garden-locomotion-parity.mjs pins a BASELINE_SHA (6be2dd2) and
          # reads it with `git show <sha>:site/assets/garden/scene.glsl`. The
          # default shallow fetch has exactly one commit, so in CI that suite
          # did not fail — it CRASHED, `fatal: invalid object name '6be2dd2'`,
          # in one second, and with continue-on-error that read as a green
          # step. Full history is the only thing that makes a pinned-baseline
          # comparison possible at all.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Repository-level checks: public-repo hygiene, workflow config validity,
      # and that no test suite is orphaned from both gates. Cheap and first, so
      # a config mistake fails in seconds rather than 20 minutes into the
      # battery. Same script the pre-push hook runs.
      - name: Preflight
        run: ./scripts/preflight.sh

      - name: Install harness dependencies
        working-directory: tools/test
        run: npm ci --no-fund --no-audit

      - name: Install browser and virtual display
        # The harness is Playwright-backed now: browser.mjs's chromePath()
        # returns chromium.executablePath(), so the browser has to come from
        # playwright-core's own installer, not @puppeteer/browsers.
        #
        # xvfb is required for EVERY suite, not just webgpu-live: launch()
        # always runs HEADED (headless chromium reports a SwiftShader adapter
        # and cannot prove anything about real rendering), and resolveDisplay()
        # falls back to Xvfb when there is no Wayland socket to borrow — which
        # is the case on a runner.
        #
        # working-directory matters here and its absence is what broke CI for a
        # day: `npx --no-install` resolves the binary from the node_modules of
        # the CURRENT directory. Run from the repo root there is no such tree,
        # so npx tried to FETCH playwright-core, and --no-install (correctly)
        # cancelled instead — "missing packages and no YES option". The install
        # step right above had already succeeded; only the cwd was wrong. This
        # cannot reproduce locally, where tools/test/node_modules always exists.
        working-directory: tools/test
        run: |
          npx --no-install playwright-core install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb

      - name: Prepare output/log directory
        run: mkdir -p tools/test/out/logs

      # One suite per process, sequentially — see the workflow-level comment.
      # Each is tee'd to its own log under tools/test/out/logs/ so a failure
      # artifact (uploaded below) has every suite's output, not just the one
      # that failed.
      # The two pure-Node multiplayer suites run FIRST: they need no browser
      # and no static server, so a protocol or relay break fails the battery
      # in seconds instead of twenty minutes into the browser suites.
      # mp-protocol.mjs runs server/test/*.test.mjs via an EXPANDED GLOB, never
      # `node --test server/test/` — the bare-directory form require()s the
      # directory on Node 26.x instead of discovering tests.
      # mp-netclient covers the PURE exports net.js/timesync.js promise not to
      # hide behind a socket (min-RTT estimator, slot allocator, relay
      # discovery). It shipped with lane L2 but no step ever ran it.
      # EVERY suite step below carries `continue-on-error: true`, and the
      # "Battery verdict" step at the end is what fails the job. This is not a
      # softening — the verdict re-derives pass/fail from each suite's own log
      # and exits non-zero on any failure, so the job still goes red for
      # exactly the same reasons.
      #
      # It exists because a fail-fast battery reports ONE broken suite per
      # 30-minute round trip, and this repo has a class of failure that only
      # exists on a GPU-less runner. Finding four of them cost most of a day
      # and four separate pushes; running them all and reporting a table costs
      # one. The two suites that were already `continue-on-error` for their own
      # reasons (mp-clock, webgpu-live/-fallback) stay ADVISORY — the verdict
      # skips their logs by name, so they still cannot fail the job.
      - name: mp-netclient
        continue-on-error: true
        timeout-minutes: 10
        working-directory: tools/test
        run: node mp-netclient.mjs 2>&1 | tee out/logs/mp-netclient.log
      - name: mp-protocol
        continue-on-error: true
        timeout-minutes: 10
        working-directory: tools/test
        run: node mp-protocol.mjs 2>&1 | tee out/logs/mp-protocol.log
      - name: mp-relay
        continue-on-error: true
        timeout-minutes: 10
        working-directory: tools/test
        run: node mp-relay.mjs 2>&1 | tee out/logs/mp-relay.log
      - name: smoke
        continue-on-error: true
        timeout-minutes: 10
        working-directory: tools/test
        run: node smoke.mjs 2>&1 | tee out/logs/smoke.log
      - name: garden
        if: env.TIER == 'full'
        continue-on-error: true
        timeout-minutes: 45
        working-directory: tools/test
        run: node garden.mjs 2>&1 | tee out/logs/garden.log
      - name: garden-connections
        if: env.TIER == 'full'
        continue-on-error: true
        timeout-minutes: 20
        working-directory: tools/test
        run: node garden-connections.mjs 2>&1 | tee out/logs/garden-connections.log
      - name: garden-movement
        if: env.TIER != 'deploy'
        continue-on-error: true
        timeout-minutes: 10
        working-directory: tools/test
        run: node garden-movement.mjs 2>&1 | tee out/logs/garden-movement.log
      - name: garden-perf
        if: env.TIER == 'full'
        continue-on-error: true
        timeout-minutes: 20
        working-directory: tools/test
        run: node garden-perf.mjs 2>&1 | tee out/logs/garden-perf.log
      - name: garden-wgsl-parity
        if: env.TIER == 'full'
        continue-on-error: true
        timeout-minutes: 20
        working-directory: tools/test
        run: node garden-wgsl-parity.mjs 2>&1 | tee out/logs/garden-wgsl-parity.log
      - name: garden-camera
        if: env.TIER != 'deploy'
        continue-on-error: true
        timeout-minutes: 10
        working-directory: tools/test
        run: node garden-camera.mjs 2>&1 | tee out/logs/garden-camera.log
      - name: garden-locomotion-parity
        continue-on-error: true
        timeout-minutes: 10
        working-directory: tools/test
        run: node garden-locomotion-parity.mjs 2>&1 | tee out/logs/garden-locomotion-parity.log
      - name: garden-uniform-inspector
        if: env.TIER != 'deploy'
        continue-on-error: true
        timeout-minutes: 10
        working-directory: tools/test
        run: node garden-uniform-inspector.mjs 2>&1 | tee out/logs/garden-uniform-inspector.log
      - name: dgc-graph
        continue-on-error: true
        timeout-minutes: 10
        working-directory: tools/test
        run: node dgc-graph.mjs 2>&1 | tee out/logs/dgc-graph.log
      - name: garden-attribution
        continue-on-error: true
        timeout-minutes: 10
        working-directory: tools/test
        run: node garden-attribution.mjs 2>&1 | tee out/logs/garden-attribution.log
      - name: attribution-page
        if: env.TIER != 'deploy'
        continue-on-error: true
        timeout-minutes: 10
        working-directory: tools/test
        run: node attribution-page.mjs 2>&1 | tee out/logs/attribution-page.log
      - name: comp0
        continue-on-error: true
        timeout-minutes: 10
        working-directory: tools/test
        run: node comp0.mjs 2>&1 | tee out/logs/comp0.log
      - name: comp1
        continue-on-error: true
        timeout-minutes: 10
        working-directory: tools/test
        run: node comp1.mjs 2>&1 | tee out/logs/comp1.log
      - name: comp2
        continue-on-error: true
        timeout-minutes: 10
        working-directory: tools/test
        run: node comp2.mjs 2>&1 | tee out/logs/comp2.log
      - name: comp3
        if: env.TIER == 'full'
        continue-on-error: true
        timeout-minutes: 20
        working-directory: tools/test
        run: node comp3.mjs 2>&1 | tee out/logs/comp3.log
      - name: anatomy
        continue-on-error: true
        timeout-minutes: 10
        working-directory: tools/test
        run: node anatomy.mjs 2>&1 | tee out/logs/anatomy.log
      - name: layout
        continue-on-error: true
        timeout-minutes: 10
        working-directory: tools/test
        run: node layout.mjs 2>&1 | tee out/logs/layout.log
      - name: lineage
        continue-on-error: true
        timeout-minutes: 10
        working-directory: tools/test
        run: node lineage.mjs 2>&1 | tee out/logs/lineage.log
      - name: loader
        continue-on-error: true
        timeout-minutes: 10
        working-directory: tools/test
        run: node loader.mjs 2>&1 | tee out/logs/loader.log
      - name: seed
        continue-on-error: true
        timeout-minutes: 10
        working-directory: tools/test
        run: node seed.mjs 2>&1 | tee out/logs/seed.log
      - name: admission-sac
        continue-on-error: true
        timeout-minutes: 10
        working-directory: tools/test
        run: node admission-sac.mjs 2>&1 | tee out/logs/admission-sac.log
      - name: runtime-host-loss
        continue-on-error: true
        timeout-minutes: 10
        working-directory: tools/test
        run: node runtime-host-loss.mjs 2>&1 | tee out/logs/runtime-host-loss.log
      # MP-4 (multiplayer-spec.md §6.1) acceptance for prepareShader()'s
      # compile-without-swapping contract — the I4 guarantee that a remote
      # commit can never blank the local world. It shipped with lane L4 and
      # was gated only by scripts/gpu-gate.sh; its GL2 and WebGPU halves both
      # pass on a software adapter, so CI can block on it too.
      - name: runtime-prepare-shader
        continue-on-error: true
        timeout-minutes: 10
        working-directory: tools/test
        run: node runtime-prepare-shader.mjs 2>&1 | tee out/logs/runtime-prepare-shader.log
      - name: servesite
        continue-on-error: true
        timeout-minutes: 10
        working-directory: tools/test
        run: node servesite.mjs 2>&1 | tee out/logs/servesite.log
      - name: perf
        if: env.TIER == 'full'
        continue-on-error: true
        timeout-minutes: 20
        working-directory: tools/test
        run: node perf.mjs 2>&1 | tee out/logs/perf.log

      # Multiplayer browser suites — BLOCKING, unlike the two webgpu-* steps
      # below. The contract is backend-agnostic after docs/multiplayer-spec.md
      # §0.5 C1 was superseded; what still binds them here is that they
      # exercise whatever backend a fresh room mount lands on
      # (runtime-host.js prefer:'auto' → WebGPU by default, WebGL2 otherwise),
      # and SwiftShader on this runner class covers both — so there is no GPU
      # excuse for these to be advisory.
      # Each starts its own relay in-process on a pid-derived port and dials
      # it with ?relay=ws://... — site/assets/relay.json stays {"url": null}.
      - name: mp-clock (timing quality — non-blocking, see comment)
        id: mp_clock
        if: env.TIER != 'deploy'
        continue-on-error: true
        timeout-minutes: 10
        working-directory: tools/test
        # Advisory HERE only, and blocking in scripts/gpu-gate.sh. Check (a)
        # asserts two converged clocks stay within 120ms of each other, which
        # is a real-time quality property: it measures how evenly the machine
        # can schedule two live pages, not whether the sync logic is correct.
        # MEASURED on a software adapter (what a GPU-less runner gets): worst
        # diff 143.4ms, over the bound. On real hardware the same suite is
        # all-PASS. The threshold is deliberately NOT loosened to make CI
        # green — that would retire the assertion everywhere to satisfy the
        # one environment least able to judge it.
        run: node mp-clock.mjs 2>&1 | tee out/logs/mp-clock.log
      - name: mp-two-browsers
        if: env.TIER != 'deploy'
        continue-on-error: true
        timeout-minutes: 22
        working-directory: tools/test
        run: node mp-two-browsers.mjs 2>&1 | tee out/logs/mp-two-browsers.log
      # I4: a receiver must keep rendering when a peer commits broken source.
      - name: mp-compile-swap
        if: env.TIER != 'deploy'
        continue-on-error: true
        timeout-minutes: 18
        working-directory: tools/test
        run: node mp-compile-swap.mjs 2>&1 | tee out/logs/mp-compile-swap.log
      # I1/I3: the solo route must be byte-identical in behaviour to pre-MP.
      - name: mp-solo-parity
        if: env.TIER != 'deploy'
        continue-on-error: true
        timeout-minutes: 10
        working-directory: tools/test
        run: node mp-solo-parity.mjs 2>&1 | tee out/logs/mp-solo-parity.log

      - name: webgpu-live (real WebGPU execution — non-blocking, see comment)
        id: webgpu_live
        if: env.TIER != 'deploy'
        continue-on-error: true
        timeout-minutes: 10
        # NOT part of the required gate. webgpu-live.mjs proves real WebGPU
        # execution (the badge actually reading "WebGPU") by re-execing
        # itself under Xvfb and launching chromium HEADED against a virtual
        # display with the real Vulkan ANGLE backend (see the script's
        # header, point 3) — chromium's own `--headless=new` kills the
        # GPUDevice ~1s into use, so headless-in-name can't prove this.
        # GitHub's ubuntu-latest runners have no GPU, so `--use-angle=vulkan`
        # has nothing to bind to. The obvious fallback, forcing the software
        # backend (SG_ANGLE=swiftshader), was tested empirically here and
        # does NOT work either — requestAdapter() resolves to null in real
        # page content under Xvfb+headed+swiftshader regardless of flags
        # tried (see the script's header, point 4). So this step runs for
        # its own log/screenshot value but cannot pass on this runner class;
        # it stays a real assertion (not disabled) for whenever a self-hosted
        # GPU runner picks this up.
        working-directory: tools/test
        run: node webgpu-live.mjs 2>&1 | tee out/logs/webgpu-live.log

      - name: webgpu-fallback (broken-WGSL → WebGL2 regression — non-blocking, same GPU constraint)
        id: webgpu_fallback
        if: env.TIER != 'deploy'
        continue-on-error: true
        timeout-minutes: 10
        # Same runner-class limitation as webgpu-live above: the canvas
        # context-type-lock regression only reproduces where navigator.gpu
        # exists and a real adapter answers, which GitHub's GPU-less runners
        # can't provide. Runs for its log value; a self-hosted GPU runner
        # makes both of these real gates.
        working-directory: tools/test
        run: node webgpu-fallback.mjs 2>&1 | tee out/logs/webgpu-fallback.log

      # THE gate. Every suite above is continue-on-error, so this step is what
      # decides whether the battery passed, and it decides from each suite's
      # own log rather than from a step outcome — a suite that crashed before
      # printing its verdict has no "all-PASS" line and is counted as failed,
      # which is the same conclusion by a more direct route.
      #
      # ADVISORY is a per-suite property with a reason attached, listed here so
      # it is one place and not scattered through 30 steps. Everything else is
      # blocking. Adding a name to this list is a deliberate act; it should
      # come with the same kind of comment its step already carries.
      - name: Battery verdict
        if: always()
        working-directory: tools/test
        run: |
          ADVISORY="mp-clock webgpu-live webgpu-fallback"
          fail=0
          echo "suite                          result"
          echo "------------------------------ ------"
          for f in out/logs/*.log; do
            [ -e "$f" ] || continue
            n=$(basename "$f" .log)
            adv=no
            for a in $ADVISORY; do [ "$a" = "$n" ] && adv=yes; done
            if grep -q 'all-PASS' "$f"; then
              printf '%-30s ok\n' "$n"
            elif [ "$adv" = yes ]; then
              printf '%-30s FAIL (advisory)\n' "$n"
            else
              printf '%-30s FAIL\n' "$n"
              fail=1
            fi
          done
          if [ "$fail" = 0 ]; then
            echo; echo "battery: every blocking suite passed."
            exit 0
          fi
          echo
          echo "=== failing checks, all suites, one pass ==="
          for f in out/logs/*.log; do
            [ -e "$f" ] || continue
            grep -q 'all-PASS' "$f" && continue
            echo "--- $(basename "$f" .log) ---"
            grep -E '^FAIL ' "$f" | head -40
          done
          exit 1

      - name: Upload screenshot/log artifacts
        # always(), not failure(): a job that hits its own timeout-minutes ends
        # CANCELLED, and `failure()` is false for a cancelled job — so the one
        # run that most needed its logs uploaded was the one run that skipped
        # the upload (32654025156). Uploading on a green run costs a few
        # hundred KB and makes "it passed, but how slowly?" answerable.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-battery-failure-artifacts
          path: tools/test/out/
          if-no-files-found: ignore
          retention-days: 14
